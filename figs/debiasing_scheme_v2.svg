<svg width="100%" viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ══════════════ SITE A ══════════════ -->
<text x="186" y="34" text-anchor="middle" font-size="22" font-weight="500" fill="#0F6E56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Site A — calibration site</text>
<rect x="36" y="46" width="300" height="380" rx="12" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="7 3"/>

<!-- ERA5-Land A -->
<rect x="61" y="64" width="178" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text font-size="20" font-weight="500" x="150" y="93" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">ERA5-Land</text>
<text font-size="16" x="150" y="117" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Global reanalysis grid</text>

<!-- Arrow ERA5 → ONF A -->
<line x1="150" y1="136" x2="150" y2="172" stroke="rgba(150,148,140,0.5)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ONF station A -->
<rect x="61" y="174" width="178" height="72" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
<text font-size="20" font-weight="500" x="150" y="203" text-anchor="middle" dominant-baseline="central" fill="#633806" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">ONF station</text>
<text font-size="16" x="150" y="227" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Local weather obs.</text>

<!-- Arrow ONF → Bias model A -->
<line x1="150" y1="246" x2="150" y2="282" stroke="rgba(150,148,140,0.5)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Bias model A -->
<rect x="61" y="284" width="178" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text font-size="20" font-weight="500" x="150" y="313" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Bias model</text>
<text font-size="16" x="150" y="337" text-anchor="middle" dominant-baseline="central" fill="#444441" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">f(ERA5) ≈ obs.</text>

<!-- paired records annotation -->
<text font-size="16" x="254" y="163" text-anchor="start" fill="rgba(160,158,150,0.9)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">paired</text>
<text font-size="16" x="254" y="181" text-anchor="start" fill="rgba(160,158,150,0.9)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">records</text>

<!-- ══════════════ TRANSFER ARROW ══════════════ -->
<text font-size="17" x="370" y="316" text-anchor="middle" fill="rgba(160,158,150,0.9)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">transfer</text>
<text font-size="17" x="370" y="336" text-anchor="middle" fill="rgba(160,158,150,0.9)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">function f</text>
<path d="M 239 320 L 340 320 L 482 320" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrow)"/>

<!-- ══════════════ SITE B ══════════════ -->
<text x="546" y="34" text-anchor="middle" font-size="22" font-weight="500" fill="#854F0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Site B — target site</text>
<rect x="384" y="46" width="300" height="380" rx="12" fill="none" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="7 3"/>

<!-- ERA5-Land B -->
<rect x="457" y="64" width="178" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text font-size="20" font-weight="500" x="546" y="93" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">ERA5-Land</text>
<text font-size="16" x="546" y="117" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Global reanalysis grid</text>

<!-- Arrow ERA5 B → no station -->
<line x1="546" y1="136" x2="546" y2="172" stroke="rgba(150,148,140,0.5)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- No local station placeholder -->
<rect x="457" y="174" width="178" height="72" rx="8" fill="none" stroke="rgba(150,148,140,0.2)" stroke-width="0.8" stroke-dasharray="4 2"/>
<text font-size="17" x="546" y="203" text-anchor="middle" dominant-baseline="central" fill="rgba(150,148,140,0.8)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">No local</text>
<text font-size="17" x="546" y="225" text-anchor="middle" dominant-baseline="central" fill="rgba(150,148,140,0.8)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">station</text>

<!-- Arrow → corrected output B -->
<line x1="546" y1="246" x2="546" y2="282" stroke="rgba(150,148,140,0.5)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="17" x="562" y="268" text-anchor="start" fill="rgba(160,158,150,0.9)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">apply f</text>

<!-- Corrected output B -->
<rect x="457" y="284" width="178" height="72" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
<text font-size="20" font-weight="500" x="546" y="308" text-anchor="middle" dominant-baseline="central" fill="#633806" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Corrected T, RH…</text>
<text font-size="16" x="546" y="334" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Debiased microclimate</text>

<!-- Arrow → ecological application -->
<line x1="546" y1="356" x2="546" y2="408" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Ecological application -->
<rect x="441" y="410" width="210" height="72" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
<text font-size="20" font-weight="500" x="546" y="436" text-anchor="middle" dominant-baseline="central" fill="#633806" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Microclimate model</text>
<text font-size="16" x="546" y="462" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Ecological application</text>

<!-- ══════════════ LEGEND ══════════════ -->
<rect x="40" y="510" width="20" height="4" rx="1" fill="#0F6E56"/>
<text font-size="17" x="68" y="516" dominant-baseline="central" fill="rgba(160,158,150,0.9)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">ERA5-Land</text>

<rect x="40" y="535" width="20" height="4" rx="1" fill="#BA7517"/>
<text font-size="17" x="68" y="541" dominant-baseline="central" fill="rgba(160,158,150,0.9)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">ONF station / corrected output</text>

<line x1="40" y1="562" x2="60" y2="562" stroke="rgba(160,158,150,0.5)" stroke-width="1.2" stroke-dasharray="5 2"/>
<text font-size="17" x="68" y="562" dominant-baseline="central" fill="rgba(160,158,150,0.9)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Transfer of bias function f</text>

</svg>
